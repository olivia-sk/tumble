[package]
name = "tumble-desktop"
version = "1.1.0"
description = "Tumble desktop window: drag and drop, format picker, queue."
edition = "2024"
publish = false
license = "MIT"

# A workspace of its own, so `cargo test` in the main workspace does not
# build Tauri. It shares the engines through path dependencies.
[workspace]

[lib]
name = "tumble_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tumble-core = { path = "../../../crates/tumble-core" }
tumble-engines = { path = "../../../crates/tumble-engines" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
