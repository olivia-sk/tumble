[package]
name = "tumble-explorer"
version = "1.0.0"
description = "Windows 11 top-level context menu: an IExplorerCommand handler loaded by File Explorer."
edition = "2024"
publish = false
license = "MIT"

# A workspace of its own: this DLL runs inside explorer.exe, so it must
# unwind on panic (and catch it at every COM boundary) instead of aborting,
# which the main workspace's release profile does.
[workspace]

[lib]
name = "tumble_explorer"
crate-type = ["cdylib", "rlib"]

[dependencies]
tumble-core = { path = "../../crates/tumble-core" }
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[dev-dependencies]
tumble-shell = { path = "../../crates/tumble-shell" }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
