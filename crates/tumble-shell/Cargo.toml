[package]
name = "tumble-shell"
description = "Right-click menu (Explorer, Finder, Linux file managers), progress dialog, notifications, single instance."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tumble-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
