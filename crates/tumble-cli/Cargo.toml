[package]
name = "tumble-cli"
description = "tumble (the CLI, also run by the right-click menu) and tumblew.exe (the Windows menu's windowless launcher)."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "tumble"
path = "src/main.rs"

[[bin]]
name = "tumblew"
path = "src/bin/tumblew.rs"

[dependencies]
tumble-core.workspace = true
tumble-engines.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
ctrlc.workspace = true
tumble-shell.workspace = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
