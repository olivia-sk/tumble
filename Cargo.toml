[workspace]
resolver = "3"
members = ["crates/tumble-core", "crates/tumble-engines", "crates/tumble-shell", "crates/tumble-cli"]

[workspace.package]
version = "1.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
tumble-core = { path = "crates/tumble-core" }
tumble-engines = { path = "crates/tumble-engines" }
tumble-shell = { path = "crates/tumble-shell" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
ctrlc = { version = "3", features = ["termination"] }
image = { version = "0.25.10", default-features = false, features = ["avif", "bmp", "exr", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "rayon"] }
webp = { version = "0.3.1", default-features = false }
resvg = "0.48.1"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
avif-parse = "2.1.0"
exr = "1.74"
libloading = "0.8"
libc = "0.2"
toml = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
